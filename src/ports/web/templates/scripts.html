{% extends "layout.html" %}
{% set active_page = 'scripts' %}

{% block title %}Scripts_ — testum{% endblock %}

{% block extra_styles %}
<style>
  .scripts-grid { display:grid; gap:var(--sp-3); }
  .script-item {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-4);
    cursor: pointer;
    transition: background var(--dur);
    position: relative;
  }
  .script-item:hover { background: var(--surface-3); }
  .script-item-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:var(--sp-2); }
  .script-item-title { font-weight:700; font-size:var(--t-body); color:var(--fg); }
  .script-item-description { font-size:var(--t-xs); color:var(--fg-dim); margin-bottom:var(--sp-2); }
  .script-item-updated { font-size:var(--t-xs); color:var(--fg-dim); }
  .script-item-actions { display:flex; gap:8px; }
</style>
{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title">Scripts<span class="cur"></span></div>
    <div class="pg-sub" id="scripts-sub">—</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-signal" onclick="openScriptModal()">+ <span data-i18n="addScript">Add Script</span></button>
  </div>
</div>

<div id="scriptsList" class="scripts-grid">
  <div class="empty-state"><span class="prompt">$</span> loading…</div>
</div>

<!-- Script modal -->
<div class="modal-overlay" id="scriptModal">
  <div class="modal" style="max-width:600px;">
    <div class="modal-head">
      <span class="modal-title" id="scriptModalTitle">Add Script</span>
      <button class="iconbtn" onclick="closeScriptModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="scriptForm">
        <div class="field">
          <label class="field-label">Name</label>
          <input id="name" name="name" type="text" class="input" required placeholder="my-script">
        </div>
        <div class="field">
          <label class="field-label">Language</label>
          <select id="language" name="language" class="input">
            <option value="bash">Bash</option>
            <option value="python">Python</option>
            <option value="powershell">PowerShell</option>
            <option value="ansible">Ansible</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Description</label>
          <textarea id="description" name="description" class="input" rows="2" style="resize:vertical;"></textarea>
        </div>
        <div class="field">
          <label class="field-label">Content</label>
          <textarea id="content" name="content" class="input" rows="8" required style="resize:vertical;font-family:var(--font-mono);"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-err" id="deleteScriptBtn" style="display:none;margin-right:auto;" data-i18n="delete">Delete</button>
      <button type="button" class="btn btn-ghost" onclick="closeScriptModal()" data-i18n="cancel">Cancel</button>
      <button type="button" class="btn btn-signal" id="saveScriptBtn" data-i18n="save">Save</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  const API_BASE = '/api/scripts';
  let editingScriptId = null;

  window.openScriptModal = function(script) {
    const form = document.getElementById('scriptForm');
    form.reset();
    editingScriptId = null;
    document.getElementById('scriptModalTitle').textContent = script ? 'Edit Script' : 'Add Script';
    const delBtn = document.getElementById('deleteScriptBtn');
    delBtn.style.display = script ? '' : 'none';
    if (script) {
      editingScriptId = script.id;
      form.name.value = script.name || '';
      form.language.value = script.language || 'bash';
      form.description.value = script.description || '';
      form.content.value = script.content || '';
    }
    document.getElementById('scriptModal').classList.add('open');
  };

  window.closeScriptModal = function() {
    document.getElementById('scriptModal').classList.remove('open');
  };

  document.getElementById('scriptModal').addEventListener('click', function(e) {
    if (e.target === this) closeScriptModal();
  });

  async function loadScripts() {
    const container = document.getElementById('scriptsList');
    container.innerHTML = '';
    try {
      const resp = await fetch(API_BASE);
      if (!resp.ok) throw new Error('Failed to load');
      const scripts = await resp.json();
      document.getElementById('scripts-sub').textContent = scripts.length + ' scripts';
      if (!scripts || !scripts.length) {
        container.innerHTML = `<div class="empty-state"><span class="prompt">$</span> no scripts yet — add one ↗</div>`;
        return;
      }
      container.innerHTML = scripts.map(s => `
        <div class="script-item" onclick="openScriptModal(${JSON.stringify(s).replace(/"/g,'&quot;')})">
          <div class="script-item-header">
            <div class="script-item-title">${s.name||''}</div>
            <span class="pill pill-muted">${s.language||''}</span>
          </div>
          <div class="script-item-description">${s.description||''}</div>
          <div class="script-item-updated">${s.updated_at ? new Date(s.updated_at).toLocaleString() : ''}</div>
        </div>`).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state">✗ failed to load</div>`;
    }
  }

  document.getElementById('saveScriptBtn').addEventListener('click', async function() {
    const form = document.getElementById('scriptForm');
    const payload = { name: form.name.value, language: form.language.value, description: form.description.value, content: form.content.value };
    try {
      const url = editingScriptId ? (API_BASE + '/' + editingScriptId) : API_BASE;
      const method = editingScriptId ? 'PUT' : 'POST';
      const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showSnack('✗ ' + (err.detail || 'Failed to save'), 'err');
        return;
      }
      closeScriptModal();
      await loadScripts();
      showSnack('✓ Script saved', 'ok');
    } catch (err) { showSnack('✗ Network error', 'err'); }
  });

  document.getElementById('deleteScriptBtn').addEventListener('click', async function() {
    if (!editingScriptId) return;
    showSnack('Click again to confirm delete');
    this.textContent = '✓ confirm';
    this.onclick = async () => {
      try {
        const resp = await fetch(API_BASE + '/' + editingScriptId, { method: 'DELETE' });
        if (!resp.ok) throw new Error('delete failed');
        closeScriptModal();
        await loadScripts();
        showSnack('✓ Script deleted', 'ok');
      } catch (err) { showSnack('✗ Failed to delete', 'err'); }
    };
  });

  loadScripts();
})();
</script>
{% endblock %}
