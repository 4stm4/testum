{% extends "layout.html" %}
{% block title %}Operations_ — testum{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title">Operations<span class="cur"></span></div>
    <div class="pg-sub" id="fleet-status">loading fleet…</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-ghost" onclick="refreshFleet()">↻ <span data-i18n="refresh">Refresh</span></button>
    <button class="btn btn-signal" onclick="openRunModal()">
      &gt;_ <span data-i18n="runCommand">Run command</span>
    </button>
  </div>
</div>

<!-- Fleet strip -->
<div class="fleet-strip" id="fleet-strip">
  <div class="fleet-cell">
    <div class="fleet-cell-label" data-i18n="total">Total</div>
    <div class="fleet-cell-val muted" id="ft-total">—</div>
  </div>
  <div class="fleet-cell">
    <div class="fleet-cell-label" data-i18n="online">Online</div>
    <div class="fleet-cell-val ok" id="ft-online">—</div>
  </div>
  <div class="fleet-cell">
    <div class="fleet-cell-label" data-i18n="offline">Offline</div>
    <div class="fleet-cell-val err" id="ft-offline">—</div>
  </div>
  <div class="fleet-cell">
    <div class="fleet-cell-label" data-i18n="running">Running</div>
    <div class="fleet-cell-val warn" id="ft-running">—</div>
  </div>
  <div class="fleet-cell">
    <div class="fleet-cell-label" data-i18n="failed24h">Failed 24h</div>
    <div class="fleet-cell-val err" id="ft-failed">—</div>
  </div>
</div>

<!-- Two-column body -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-6);">
  <!-- Left: needs attention -->
  <div>
    <div class="card-title" style="margin-bottom:var(--sp-3);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:1.5px;color:var(--fg-dim);" data-i18n="needsAttention">Needs attention</div>
    <div id="attn-list">
      <div class="empty-state"><span class="prompt">$</span> all systems nominal_</div>
    </div>
  </div>

  <!-- Right: live jobs console -->
  <div>
    <div class="console">
      <div class="console-bar">
        <span style="color:var(--signal)">●</span>
        <span data-i18n="liveJobs">Live jobs</span>
        <span style="margin-left:auto;" id="jobs-count">—</span>
      </div>
      <div class="console-body" id="console-body">
        <div style="color:var(--fg-dim);padding:8px 0;">$ waiting for jobs…</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function refreshFleet() {
  try {
    const [platforms, jobs] = await Promise.all([
      fetch('/api/platforms/').then(r=>r.json()),
      fetch('/api/tasks/?limit=20').then(r=>r.json()).catch(()=>({items:[]}))
    ]);

    const total = platforms.length;
    // Platforms don't have real-time status without SSH check, use system_info presence as proxy
    const online = platforms.filter(p => p.system_info).length;
    const offline = total - online;
    const taskList = Array.isArray(jobs) ? jobs : (jobs.items || []);
    const running = taskList.filter(j => j.status === 'running').length;
    const failed24h = taskList.filter(j => j.status === 'failed').length;

    document.getElementById('ft-total').textContent = total;
    document.getElementById('ft-online').textContent = online;
    document.getElementById('ft-offline').textContent = offline;
    document.getElementById('ft-running').textContent = running;
    document.getElementById('ft-failed').textContent = failed24h;
    document.getElementById('fleet-status').textContent =
      `${online} online · ${offline} unreachable · updated just now`;

    // Attention list
    const attnEl = document.getElementById('attn-list');
    const unreachable = platforms.filter(p => !p.system_info);
    if (unreachable.length === 0) {
      attnEl.innerHTML = '<div class="empty-state"><span class="prompt">$</span> all systems nominal_</div>';
    } else {
      attnEl.innerHTML = unreachable.map(p => `
        <div class="attn-row">
          <span class="dot dot-err"></span>
          <div style="flex:1;">
            <div style="font-size:var(--t-body);font-weight:600;">${p.name}</div>
            <div style="font-size:var(--t-xs);color:var(--fg-dim);">${p.host}:${p.port} · unreachable</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="openRunModal('${p.id}')">ping</button>
        </div>`).join('');
    }

    // Console
    const consoleEl = document.getElementById('console-body');
    document.getElementById('jobs-count').textContent = running + ' running';
    if (taskList.length === 0) {
      consoleEl.innerHTML = '<div style="color:var(--fg-dim);">$ no recent jobs_</div>';
    } else {
      consoleEl.innerHTML = taskList.slice(0, 12).map(j => {
        const statusCls = j.status === 'success' ? 'ok' : j.status === 'running' ? 'warn' : j.status === 'failed' ? 'err' : 'muted';
        const ts = j.created_at ? new Date(j.created_at).toLocaleTimeString() : '—';
        return `<div class="console-line" style="cursor:pointer;" onclick="window.location='/tasks/${j.id}'">
          <span class="console-ts">${ts}</span>
          <span class="pill pill-${statusCls}" style="flex-shrink:0;">${j.status}</span>
          <span class="console-out" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${j.type || j.kind || 'job'}</span>
        </div>`;
      }).join('');
    }
  } catch(e) {
    document.getElementById('fleet-status').textContent = '✗ failed to load fleet data';
  }
}
refreshFleet();
setInterval(refreshFleet, 15000);
</script>
{% endblock %}
