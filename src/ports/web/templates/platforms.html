{% extends "layout.html" %}
{% block title %}Platforms_ — testum{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title">Platforms<span class="cur"></span></div>
    <div class="pg-sub" id="plat-sub">—</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-signal" onclick="openAddPlatform()">+ <span data-i18n="addPlatform">Add platform</span></button>
  </div>
</div>

<div class="master-detail" id="master-detail">
  <!-- Master list -->
  <div class="master" id="master-list">
    <div class="master-search">
      <div class="cmd-input">
        <span class="pmt">⌕</span>
        <input type="text" id="plat-search" placeholder="filter platforms…" oninput="filterPlatforms()">
      </div>
    </div>
    <div id="master-items">
      <div class="empty-state" style="padding:24px 16px;font-size:12px;">
        <span class="prompt">$</span> loading…
      </div>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail" id="detail-panel">
    <div class="empty-state" style="margin-top:80px;">
      <div class="glyph s56" style="margin:0 auto 16px;">&gt;_</div>
      <div><span class="prompt">$</span> select a platform_</div>
    </div>
  </div>
</div>

<!-- Add platform modal -->
<div class="modal-overlay" id="addPlatformModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-head">
      <span class="modal-title">+ <span data-i18n="addPlatform">Add platform</span></span>
      <button class="iconbtn" onclick="closeAddPlatform()">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="field" style="grid-column:1/-1;">
          <label class="field-label" data-i18n="name">Name</label>
          <input type="text" class="input" id="p-name" placeholder="web-01">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="host">Host</label>
          <input type="text" class="input" id="p-host" placeholder="192.168.1.1">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="port">Port</label>
          <input type="number" class="input" id="p-port" value="22" min="1" max="65535">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="username">Username</label>
          <input type="text" class="input" id="p-user" placeholder="ubuntu">
        </div>
        <div class="field">
          <label class="field-label" data-i18n="auth">Auth</label>
          <select class="input" id="p-auth" onchange="toggleAuthFields()">
            <option value="password" data-i18n="password">Password</option>
            <option value="private_key" data-i18n="sshKey">SSH Key</option>
          </select>
        </div>
        <div class="field" style="grid-column:1/-1;" id="p-password-field">
          <label class="field-label" data-i18n="password">Password</label>
          <input type="password" class="input" id="p-password" placeholder="••••••••">
        </div>
        <div class="field" style="grid-column:1/-1;display:none;" id="p-key-field">
          <label class="field-label" data-i18n="sshKey">SSH Key</label>
          <select class="input" id="p-key-select">
            <option value="">— select key —</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeAddPlatform()" data-i18n="cancel">Cancel</button>
      <button class="btn btn-signal" id="addPlatformBtn" onclick="submitAddPlatform()">+ <span data-i18n="addPlatform">Add</span></button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let platforms = [];
let selectedId = null;

async function loadPlatforms() {
  try {
    const r = await fetch('/api/platforms/');
    platforms = await r.json();
    renderMaster(platforms);
    document.getElementById('plat-sub').textContent = platforms.length + ' platforms';
  } catch(e) { showSnack('✗ Failed to load platforms', 'err'); }
}

function renderMaster(list) {
  const el = document.getElementById('master-items');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state" style="padding:24px 16px;font-size:12px;"><span class="prompt">$</span> no platforms yet — add one ↗</div>';
    return;
  }
  el.innerHTML = list.map(p => {
    const hasSys = !!p.system_info;
    return `<div class="master-item${selectedId===p.id?' active':''}" onclick="selectPlatform('${p.id}')">
      <span class="dot ${hasSys?'dot-ok':'dot-off'}"></span>
      <div>
        <div class="master-item-name">${p.name}</div>
        <div class="master-item-sub">${p.host}:${p.port}</div>
      </div>
    </div>`;
  }).join('');
}

function filterPlatforms() {
  const q = document.getElementById('plat-search').value.toLowerCase();
  renderMaster(platforms.filter(p => p.name.toLowerCase().includes(q) || p.host.toLowerCase().includes(q)));
}

async function selectPlatform(id) {
  selectedId = id;
  renderMaster(platforms.filter(p => {
    const q = document.getElementById('plat-search').value.toLowerCase();
    return !q || p.name.toLowerCase().includes(q) || p.host.toLowerCase().includes(q);
  }));
  const p = platforms.find(x => x.id === id);
  if (!p) return;
  const det = document.getElementById('detail-panel');
  const hasSys = !!p.system_info;
  const sys = p.system_info || {};
  det.innerHTML = `
    <div class="det-head">
      <span class="dot ${hasSys?'dot-ok':'dot-off'}" style="width:10px;height:10px;"></span>
      <div>
        <div class="det-name">${p.name}</div>
        <div class="det-meta">
          <span class="pill pill-muted">${p.auth_method}</span>
          <span class="pill pill-muted">${p.host}:${p.port}</span>
          ${hasSys?'<span class="pill pill-ok">ONLINE</span>':'<span class="pill pill-err">OFFLINE</span>'}
        </div>
      </div>
      <div class="det-actions">
        <button class="btn btn-ghost" onclick="deployKeys('${p.id}')">⎘ Deploy keys</button>
        <button class="btn btn-signal" onclick="openRunModal('${p.id}')">▶ Run</button>
        <button class="btn btn-err" onclick="deletePlatform('${p.id}','${p.name}')">✕</button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">CPU</div>
        <div class="metric-value" style="font-size:18px;">${sys.cpu?sys.cpu.split('(')[0].trim().slice(0,20):'—'}</div>
        <div class="metric-unit">${sys.cpu&&sys.cpu.includes('(')?sys.cpu.match(/\((.+)\)/)?.[1]||'':''}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Memory</div>
        <div class="metric-value" style="font-size:18px;">${sys.memory?sys.memory.split(',')[0]:'—'}</div>
        <div class="metric-unit">${sys.memory&&sys.memory.includes(',')?sys.memory.split(',')[1].trim():''}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Kernel</div>
        <div class="metric-value" style="font-size:14px;">${sys.kernel||'—'}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Uptime</div>
        <div class="metric-value" style="font-size:14px;">${sys.uptime||'—'}</div>
      </div>
    </div>

    <div class="det-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">Recent jobs</span></div>
        <div id="det-jobs">loading…</div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">SSH info</span></div>
        <div style="font-size:12px;color:var(--fg-muted);">
          <div style="margin-bottom:8px;"><span style="color:var(--fg-dim);">user</span> ${p.username}</div>
          <div style="margin-bottom:8px;"><span style="color:var(--fg-dim);">auth</span> ${p.auth_method}</div>
          <div><span style="color:var(--fg-dim);">fingerprint</span> ${p.known_host_fingerprint||'not verified'}</div>
        </div>
      </div>
    </div>`;
  loadPlatformJobs(id);
}

async function loadPlatformJobs(platformId) {
  try {
    const r = await fetch(`/api/tasks/?platform_id=${platformId}&limit=8`);
    const data = await r.json();
    const jobs = Array.isArray(data) ? data : (data.items || []);
    const el = document.getElementById('det-jobs');
    if (!el) return;
    if (!jobs.length) { el.innerHTML = '<div class="empty-state" style="padding:16px 0;font-size:12px;"><span class="prompt">$</span> no jobs yet</div>'; return; }
    el.innerHTML = jobs.map(j => {
      const cls = j.status==='success'?'ok':j.status==='running'?'warn':j.status==='failed'?'err':'muted';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;" onclick="window.location='/tasks/${j.id}'">
        <span class="pill pill-${cls}">${j.status}</span>
        <span style="font-size:12px;color:var(--fg-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${j.type||'job'}</span>
        <span style="font-size:11px;color:var(--fg-dim);">${j.created_at?new Date(j.created_at).toLocaleTimeString():''}</span>
      </div>`;
    }).join('');
  } catch(e) {}
}

async function deployKeys(id) {
  try {
    const r = await fetch(`/api/platforms/${id}/deploy_keys`, { method:'POST' });
    const d = await r.json();
    if (r.ok) showSnack('✓ Deploy started', 'ok');
    else showSnack('✗ ' + (d.error||'Failed'), 'err');
  } catch(e) { showSnack('✗ Network error', 'err'); }
}

async function deletePlatform(id, name) {
  showSnack(`Delete "${name}"? Click again to confirm.`, 'warn');
  const btn = event.target;
  btn.textContent = '✓ confirm';
  btn.onclick = async () => {
    try {
      const r = await fetch(`/api/platforms/${id}`, { method:'DELETE' });
      if (r.ok) {
        showSnack('✓ Deleted', 'ok');
        await loadPlatforms();
        document.getElementById('detail-panel').innerHTML = '<div class="empty-state" style="margin-top:80px;"><span class="prompt">$</span> select a platform_</div>';
      } else showSnack('✗ Delete failed', 'err');
    } catch(e) { showSnack('✗ Network error', 'err'); }
  };
}

// Add platform modal
function openAddPlatform() {
  document.getElementById('addPlatformModal').classList.add('open');
  loadKeysForModal();
}
function closeAddPlatform() {
  document.getElementById('addPlatformModal').classList.remove('open');
}
function toggleAuthFields() {
  const auth = document.getElementById('p-auth').value;
  document.getElementById('p-password-field').style.display = auth==='password'?'':'none';
  document.getElementById('p-key-field').style.display = auth==='private_key'?'':'none';
}
async function loadKeysForModal() {
  try {
    const r = await fetch('/api/keys/');
    const keys = await r.json();
    const sel = document.getElementById('p-key-select');
    sel.innerHTML = '<option value="">— select key —</option>';
    keys.forEach(k => {
      const o = document.createElement('option');
      o.value = k.id; o.textContent = k.name;
      sel.appendChild(o);
    });
  } catch(e) {}
}
async function submitAddPlatform() {
  const name = document.getElementById('p-name').value.trim();
  const host = document.getElementById('p-host').value.trim();
  const port = parseInt(document.getElementById('p-port').value) || 22;
  const username = document.getElementById('p-user').value.trim();
  const auth = document.getElementById('p-auth').value;
  if (!name||!host||!username) { showSnack('✗ ' + t('fillRequired'), 'err'); return; }
  const body = { name, host, port, username, auth_method: auth };
  if (auth==='password') body.password = document.getElementById('p-password').value;
  else body.ssh_key_id = document.getElementById('p-key-select').value || null;

  const btn = document.getElementById('addPlatformBtn');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;"></span> <span data-i18n="connecting">connecting…</span></span>';

  try {
    const r = await fetch('/api/platforms/', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (r.ok) {
      closeAddPlatform();
      showSnack('✓ ' + t('platformAdded'), 'ok');
      await loadPlatforms();
    } else {
      showSnack('✗ ' + (d.error||d.details||'Failed'), 'err');
    }
  } catch(e) {
    showSnack('✗ ' + t('networkError'), 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '+ <span data-i18n="addPlatform">' + t('addPlatform') + '</span>';
  }
}

loadPlatforms();
</script>
{% endblock %}
