{% extends "layout.html" %}
{% block title %}SSH keys_ — testum{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title">SSH keys<span class="cur"></span></div>
    <div class="pg-sub" id="keys-sub">—</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-signal" onclick="openAddKey()">+ <span data-i18n="addKey">Add key</span></button>
  </div>
</div>

<div id="keys-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--sp-4);">
  <div class="empty-state"><span class="prompt">$</span> loading…</div>
</div>

<!-- Add key modal -->
<div class="modal-overlay" id="addKeyModal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">+ <span data-i18n="addKey">Add SSH key</span></span>
      <button class="iconbtn" onclick="closeAddKey()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label" data-i18n="name">Name</label>
        <input type="text" class="input" id="k-name" placeholder="prod-key">
      </div>
      <div class="field">
        <label class="field-label" data-i18n="publicKeyLabel">Public key</label>
        <textarea class="input" id="k-pubkey" rows="3" placeholder="ssh-ed25519 AAAA…" style="resize:vertical;"></textarea>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="privateKeyLabel">Private key</label>
        <textarea class="input" id="k-privkey" rows="4" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----" style="resize:vertical;"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeAddKey()" data-i18n="cancel">Cancel</button>
      <button class="btn btn-signal" onclick="submitAddKey()">+ <span data-i18n="addKey">Add</span></button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allPlatforms = [];
async function loadKeys() {
  try {
    const [kr, pr] = await Promise.all([fetch('/api/keys/'), fetch('/api/platforms/')]);
    const keys = await kr.json();
    allPlatforms = await pr.json();
    document.getElementById('keys-sub').textContent = keys.length + ' keys';
    const grid = document.getElementById('keys-grid');
    if (!keys.length) {
      grid.innerHTML = '<div class="empty-state"><span class="prompt">$</span> no SSH keys yet — add one ↗</div>';
      return;
    }
    grid.innerHTML = keys.map(k => `
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="glyph s28">&gt;_</div>
            <div>
              <div style="font-size:var(--t-body);font-weight:700;">${k.name}</div>
              <div style="font-size:var(--t-xs);color:var(--fg-dim);">${k.has_private_key?'pub + priv':'pub only'}</div>
            </div>
          </div>
          <button class="iconbtn" onclick="deleteKey('${k.id}','${k.name}')">✕</button>
        </div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:var(--sp-3);" title="${k.public_key}">
          ${k.public_key.substring(0,60)}…
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:var(--t-xs);color:var(--fg-dim);">by ${k.created_by||'—'} · ${k.created_at?new Date(k.created_at).toLocaleDateString():''}</div>
          <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px;" onclick="deployKey('${k.id}')">⎘ Deploy</button>
        </div>
      </div>`).join('');
  } catch(e) { showSnack('✗ Failed to load keys', 'err'); }
}

async function deleteKey(id, name) {
  showSnack(`Delete "${name}"? Click again to confirm.`);
  const btn = event.target;
  btn.textContent = '✓';
  btn.onclick = async () => {
    try {
      const r = await fetch(`/api/keys/${id}`, { method:'DELETE' });
      if (r.ok) { showSnack('✓ Key deleted', 'ok'); loadKeys(); }
      else showSnack('✗ Delete failed', 'err');
    } catch(e) { showSnack('✗ Network error', 'err'); }
  };
}

async function deployKey(keyId) {
  if (!allPlatforms.length) { showSnack('No platforms to deploy to', 'warn'); return; }
  for (const p of allPlatforms) {
    await fetch(`/api/platforms/${p.id}/deploy_keys`, { method:'POST' }).catch(()=>{});
  }
  showSnack(`✓ Deploy started to ${allPlatforms.length} platforms`, 'ok');
}

function openAddKey() { document.getElementById('addKeyModal').classList.add('open'); }
function closeAddKey() { document.getElementById('addKeyModal').classList.remove('open'); }
async function submitAddKey() {
  const name = document.getElementById('k-name').value.trim();
  const pub = document.getElementById('k-pubkey').value.trim();
  if (!name||!pub) { showSnack('✗ Name and public key required', 'err'); return; }
  const body = { name, public_key: pub };
  const priv = document.getElementById('k-privkey').value.trim();
  if (priv) body.private_key = priv;
  try {
    const r = await fetch('/api/keys/', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const d = await r.json();
    if (r.ok) { closeAddKey(); showSnack('✓ Key added', 'ok'); loadKeys(); }
    else showSnack('✗ ' + (d.error||'Failed'), 'err');
  } catch(e) { showSnack('✗ Network error', 'err'); }
}
loadKeys();
</script>
{% endblock %}
