<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>testum_ · authenticate</title>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/terminal.css">
  <link rel="stylesheet" href="/static/components.css">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 60% at 50% 30%,
        color-mix(in srgb, var(--signal) 6%, transparent) 0%,
        transparent 70%);
    }
    .login-wrap { width: 100%; max-width: 380px; }
    .login-brand {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 32px; justify-content: center;
    }
    .login-brand-text .wordmark { font-size: 28px; }
    .login-brand-text .by-4stm4 { text-align: center; margin-top: 2px; }
    .boot-strip {
      display: flex; gap: 8px; align-items: center;
      margin-bottom: 28px; justify-content: center;
    }
    .boot-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--surface-5);
    }
    .boot-dot.ok { background: var(--signal); box-shadow: 0 0 6px var(--signal); }
    .boot-dot.warn { background: var(--warn); }
    .boot-label { font-size: 10px; color: var(--fg-dim); margin-left: 4px; }
    .login-card {
      background: var(--surface-1);
      border: 1px solid var(--surface-4);
      border-radius: var(--r-xl);
      padding: 32px 28px;
    }
    .login-heading {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--fg-dim); margin-bottom: 6px;
    }
    .login-prompt {
      font-size: 15px; color: var(--fg); margin-bottom: 28px;
    }
    .login-prompt .p { color: var(--signal); }
    .login-prompt .blink { display:inline-block; width:0.5em; height:1em; background:var(--signal); vertical-align:text-bottom; margin-left:1px; animation:blink 1.1s step-end infinite; }
    .login-footer {
      display: flex; justify-content: space-between;
      margin-top: 20px; font-size: 10px; color: var(--fg-dim);
    }
    .err-msg {
      background: color-mix(in srgb, var(--err) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--err) 30%, transparent);
      border-radius: var(--r-md);
      padding: 8px 12px;
      font-size: var(--t-sm);
      color: var(--err);
      margin-bottom: 16px;
      display: none;
    }
    .lang-btn {
      position: fixed; top: 16px; right: 16px;
      background: var(--surface-2); border: 1px solid var(--line);
      color: var(--fg-dim); font-family: var(--font-mono);
      font-size: var(--t-xs); padding: 4px 10px;
      border-radius: var(--r-sm); cursor: pointer;
      transition: all var(--dur);
    }
    .lang-btn:hover { color: var(--fg); border-color: var(--fg-muted); }
  </style>
</head>
<body>
  <button class="lang-btn" id="langToggle">RU</button>

  <div class="login-wrap">
    <div class="login-brand">
      <div class="glyph s40">&gt;_</div>
      <div class="login-brand-text">
        <div class="wordmark">testum<span class="cur"></span></div>
        <div class="by-4stm4">a <b>4stm4</b> tool</div>
      </div>
    </div>

    <div class="boot-strip">
      <span class="boot-dot ok"></span>
      <span class="boot-dot ok"></span>
      <span class="boot-dot ok"></span>
      <span class="boot-label">vault · ssh pool · db</span>
    </div>

    <div class="login-card">
      <div class="login-heading" data-i18n="authenticate">Authenticate</div>
      <div class="login-prompt"><span class="p">$</span> <span data-i18n="signInToContinue">sign in to continue</span><span class="blink"></span></div>

      <div class="err-msg" id="errMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label class="field-label" data-i18n="username">Username</label>
          <div class="input-wrap">
            <span class="input-pmt">&gt;</span>
            <input type="text" class="input" id="username" name="username" required
              placeholder="admin" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label class="field-label" data-i18n="password">Password</label>
          <div class="input-wrap">
            <span class="input-pmt">&gt;</span>
            <input type="password" class="input" id="password" name="password" required
              placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn btn-signal btn-full" id="loginBtn" style="margin-top:8px;">
          &gt;_ <span data-i18n="signIn">Sign in</span>
        </button>
      </form>

      <div class="login-footer">
        <span>v0.2.0 · main</span>
        <span>4stm4/testum · MIT</span>
      </div>
    </div>
  </div>

  <script>
    const T = {
      en: { authenticate:'Authenticate', username:'Username', password:'Password', signIn:'Sign in', signInToContinue:'sign in to continue', signingIn:'signing in…', invalidCreds:'invalid credentials', connError:'connection error' },
      ru: { authenticate:'Аутентификация', username:'Пользователь', password:'Пароль', signIn:'Войти', signInToContinue:'введите учётные данные', signingIn:'вход…', invalidCreds:'неверные учётные данные', connError:'ошибка соединения' }
    };
    let lang = localStorage.getItem('testum-lang') || 'en';
    function applyLang(l) {
      lang = l;
      document.documentElement.setAttribute('lang', l);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (T[l][k]) el.textContent = T[l][k];
      });
      document.getElementById('langToggle').textContent = l === 'en' ? 'RU' : 'EN';
    }
    applyLang(lang);
    document.getElementById('langToggle').addEventListener('click', () => {
      const next = lang === 'en' ? 'ru' : 'en';
      try { localStorage.setItem('testum-lang', next); } catch(e) {}
      applyLang(next);
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const t = T[lang];
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errMsg');
      btn.textContent = '>_ ' + t.signingIn;
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const d = await r.json();
        if (r.ok) {
          document.cookie = `access_token=${d.access_token}; path=/; max-age=86400; SameSite=Lax`;
          window.location.href = '/';
        } else {
          err.textContent = '✗ ' + (d.error || t.invalidCreds);
          err.style.display = 'block';
          btn.textContent = '>_ ' + t.signIn;
          btn.disabled = false;
        }
      } catch(ex) {
        err.textContent = '✗ ' + t.connError;
        err.style.display = 'block';
        btn.textContent = '>_ ' + t.signIn;
        btn.disabled = false;
      }
    });
    document.getElementById('username').focus();
    if (document.cookie.includes('access_token=')) window.location.href = '/';
  </script>
</body>
</html>
