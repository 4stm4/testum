{% extends "layout.html" %}
{% set active_page = 'automations' %}

{% block title %}Automations_ — testum{% endblock %}

{% block extra_styles %}
<style>
  .auto-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-5);
    display: grid;
    gap: var(--sp-3);
  }
  .auto-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--sp-4);
  }
  .auto-title {
    font-size: var(--t-md);
    font-weight: 700;
    color: var(--fg);
    margin: 0 0 var(--sp-1);
  }
  .auto-desc {
    font-size: var(--t-xs);
    color: var(--fg-dim);
  }
  .auto-command {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--sp-2) var(--sp-3);
    font-family: var(--font-mono);
    font-size: var(--t-xs);
    color: var(--fg-muted);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 64px;
    overflow: hidden;
  }
  .auto-meta {
    display: flex;
    gap: var(--sp-3);
    flex-wrap: wrap;
    align-items: center;
    font-size: var(--t-xs);
    color: var(--fg-dim);
  }
  .auto-actions {
    display: flex;
    gap: var(--sp-2);
    flex-wrap: wrap;
    align-items: center;
  }
  .autos-grid { display: grid; gap: var(--sp-4); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-3);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4);
  }
  .switch-row span { font-size: var(--t-body); color: var(--fg); }
</style>
{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title">Automations<span class="cur"></span></div>
    <div class="pg-sub" id="autos-sub">—</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-signal" onclick="openJobModal()">+ Add Automation</button>
  </div>
</div>

<div class="autos-grid" id="jobsList">
  <div class="empty-state"><span class="prompt">$</span> loading…</div>
</div>

<!-- Create Automation Modal -->
<div class="modal-overlay" id="jobModal">
  <div class="modal" style="max-width:680px;">
    <div class="modal-head">
      <span class="modal-title">New Automation</span>
      <button class="iconbtn" onclick="closeJobModal()">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:var(--sp-4);">
      <div class="field">
        <label class="field-label">Name</label>
        <input id="jobName" class="input" placeholder="Nightly security baseline">
      </div>
      <div class="field">
        <label class="field-label">Description</label>
        <textarea id="jobDescription" class="input" rows="2" placeholder="What does this automation do?" style="resize:vertical;"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Execution type</label>
        <div style="display:flex;gap:var(--sp-3);">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 14px;flex:1;">
            <input type="radio" name="executionType" value="command" checked> &gt;_ Shell command
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 14px;flex:1;">
            <input type="radio" name="executionType" value="script"> {} Script
          </label>
        </div>
      </div>
      <div id="commandField" class="field">
        <label class="field-label">Command</label>
        <textarea id="jobCommand" class="input" rows="3" placeholder="#!/bin/bash&#10;apt update && apt upgrade -y" style="resize:vertical;"></textarea>
      </div>
      <div id="scriptField" class="field" style="display:none;">
        <label class="field-label">Script</label>
        <select id="jobScript" class="input"></select>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="field-label">Trigger</label>
          <select id="jobTrigger" class="input">
            <option value="manual">Manual</option>
            <option value="cron">Cron schedule</option>
            <option value="github_push">GitHub push</option>
            <option value="webhook">Webhook</option>
          </select>
        </div>
        <div id="cronField" class="field" style="display:none;">
          <label class="field-label">Cron expression</label>
          <input id="jobCron" class="input" placeholder="0 3 * * *">
        </div>
      </div>
      <div id="githubFields" class="field" style="display:none;">
        <label class="field-label">GitHub repository</label>
        <input id="jobRepo" class="input" placeholder="https://github.com/org/repo" style="margin-bottom:var(--sp-2);">
        <label class="field-label">Branch</label>
        <input id="jobBranch" class="input" placeholder="main">
      </div>
      <div id="webhookField" class="field" style="display:none;">
        <label class="field-label">Webhook secret</label>
        <div style="display:flex;gap:var(--sp-2);">
          <input id="jobSecret" class="input" placeholder="auto-generated">
          <button id="generateSecret" type="button" class="btn btn-ghost" style="flex-shrink:0;">Generate</button>
        </div>
      </div>
      <div class="switch-row">
        <span>Run on all platforms</span>
        <input type="checkbox" id="jobRunAll">
      </div>
      <div id="platformField" class="field">
        <label class="field-label">Target platforms</label>
        <select id="jobPlatforms" class="input" multiple size="4"></select>
      </div>
      <div class="form-row">
        <div class="field">
          <label class="field-label">Timeout (seconds)</label>
          <input id="jobTimeout" class="input" type="number" min="60" max="86400" value="900">
        </div>
        <div class="field">
          <label class="field-label">Retries on error</label>
          <input id="jobRetries" class="input" type="number" min="0" max="10" value="0">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Environment variables (KEY=VALUE)</label>
        <textarea id="jobEnv" class="input" rows="2" placeholder="IMAGE=registry.example.com/app:latest" style="resize:vertical;"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Tags</label>
        <input id="jobTags" class="input" placeholder="security, nightly">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeJobModal()">Cancel</button>
      <button class="btn btn-signal" id="createJob">+ Save automation</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const jobsListEl = document.getElementById('jobsList');
const runAllCheckbox = document.getElementById('jobRunAll');
const platformsSelect = document.getElementById('jobPlatforms');
const triggerSelect = document.getElementById('jobTrigger');
const executionRadios = document.querySelectorAll('input[name="executionType"]');
const commandField = document.getElementById('commandField');
const scriptField = document.getElementById('scriptField');
const cronField = document.getElementById('cronField');
const githubFields = document.getElementById('githubFields');
const webhookField = document.getElementById('webhookField');

function openJobModal() {
  document.getElementById('jobModal').classList.add('open');
}
function closeJobModal() {
  document.getElementById('jobModal').classList.remove('open');
}
document.getElementById('jobModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('jobModal')) closeJobModal();
});

async function loadPlatforms() {
  const response = await fetch('/api/platforms/');
  if (!response.ok) return;
  const platforms = await response.json();
  platformsSelect.innerHTML = platforms.map(p => `<option value="${p.id}">${p.name} (${p.host})</option>`).join('');
}

async function loadScriptsForModal() {
  const response = await fetch('/api/scripts/');
  if (!response.ok) return;
  const scripts = await response.json();
  if (scripts.length === 0) {
    document.getElementById('jobScript').innerHTML = `<option value="">no scripts available</option>`;
    return;
  }
  document.getElementById('jobScript').innerHTML = scripts.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

async function loadJobs() {
  try {
    const response = await fetch('/api/automations/');
    if (!response.ok) {
      jobsListEl.innerHTML = `<div class="empty-state">✗ failed to load automations</div>`;
      return;
    }
    const jobs = await response.json();
    document.getElementById('autos-sub').textContent = jobs.length + ' automations';
    if (jobs.length === 0) {
      jobsListEl.innerHTML = `<div class="empty-state"><span class="prompt">$</span> no automations yet — add one ↗</div>`;
      return;
    }
    jobsListEl.innerHTML = jobs.map(renderJobCard).join('');
  } catch (err) {
    jobsListEl.innerHTML = `<div class="empty-state">✗ ${err.message}</div>`;
  }
}

function renderJobCard(job) {
  const triggerLabels = {
    manual: 'Manual',
    cron: `Cron: ${job.cron_expression || ''}`,
    github_push: 'GitHub push',
    webhook: 'Webhook'
  };
  const targets = job.run_on_all_platforms
    ? '<span class="pill pill-muted">All platforms</span>'
    : (job.targets||[]).map(t => `<span class="pill pill-muted">${t.platform_name || t.platform_id}</span>`).join('');
  const statusCls = job.is_enabled ? 'ok' : 'muted';
  const statusLabel = job.is_enabled ? 'ENABLED' : 'PAUSED';
  const commandPreview = job.execution_type === 'command'
    ? `<div class="auto-command">${(job.command || '').slice(0, 300)}</div>`
    : `<div class="auto-command">script: ${job.script_id || '—'}</div>`;
  const toggleLabel = job.is_enabled ? '⏸ Pause' : '▶ Enable';

  return `
    <article class="auto-card" data-id="${job.id}">
      <div class="auto-header">
        <div>
          <div class="auto-title">${job.name}</div>
          <div class="auto-desc">${job.description || ''}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <span class="pill pill-${statusCls}">${statusLabel}</span>
          <span class="pill pill-muted">${triggerLabels[job.trigger_type] || job.trigger_type}</span>
        </div>
      </div>
      ${commandPreview}
      <div class="auto-meta">
        <span>Targets:</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${targets || '<span>—</span>'}</div>
        <span style="margin-left:auto;">Last run: ${job.last_run_at ? new Date(job.last_run_at).toLocaleString() : '—'}</span>
      </div>
      <div class="auto-actions">
        <button class="btn btn-ghost" style="font-size:11px;" data-action="toggle">${toggleLabel}</button>
        <button class="btn btn-err" style="font-size:11px;" data-action="delete">✕ Delete</button>
      </div>
    </article>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

jobsListEl.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  const card = button.closest('.auto-card');
  const jobId = card?.dataset.id;
  if (!jobId) return;

  if (action === 'delete') {
    showSnack('Click again to confirm delete');
    button.textContent = '✓ confirm';
    button.onclick = async () => {
      const response = await fetch(`/api/automations/${jobId}`, { method: 'DELETE' });
      if (response.ok) { showSnack('✓ Deleted', 'ok'); loadJobs(); }
      else showSnack('✗ Failed to delete', 'err');
    };
    return;
  }

  if (action === 'toggle') {
    const isEnabled = button.textContent.trim().startsWith('⏸');
    const response = await fetch(`/api/automations/${jobId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ is_enabled: !isEnabled })
    });
    if (response.ok) loadJobs();
    else showSnack('✗ Failed to update', 'err');
  }
});

function parseEnv(input) {
  const result = {};
  for (const line of input.split('\n')) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    const [key, ...rest] = trimmed.split('=');
    if (!key || rest.length === 0) continue;
    result[key.trim()] = rest.join('=').trim();
  }
  return result;
}

function parseList(input) {
  return input ? input.split(',').map(i => i.trim()).filter(Boolean) : [];
}

function updateExecutionFields() {
  const value = document.querySelector('input[name="executionType"]:checked').value;
  commandField.style.display = value === 'command' ? '' : 'none';
  scriptField.style.display = value === 'script' ? '' : 'none';
}

function updateTriggerFields() {
  const value = triggerSelect.value;
  cronField.style.display = value === 'cron' ? '' : 'none';
  githubFields.style.display = value === 'github_push' ? '' : 'none';
  webhookField.style.display = value === 'webhook' ? '' : 'none';
}

executionRadios.forEach(r => r.addEventListener('change', updateExecutionFields));
triggerSelect.addEventListener('change', updateTriggerFields);
runAllCheckbox.addEventListener('change', () => { platformsSelect.disabled = runAllCheckbox.checked; });
document.getElementById('generateSecret').addEventListener('click', () => {
  document.getElementById('jobSecret').value = Array.from(crypto.getRandomValues(new Uint8Array(24)))
    .map(v => v.toString(16).padStart(2,'0')).join('').slice(0, 48);
});

document.getElementById('createJob').addEventListener('click', async () => {
  const name = document.getElementById('jobName').value.trim();
  if (!name) { showSnack('✗ Enter automation name', 'err'); return; }

  const executionType = document.querySelector('input[name="executionType"]:checked').value;
  const triggerType = triggerSelect.value;
  const commandValue = document.getElementById('jobCommand').value.trim();
  const scriptValue = document.getElementById('jobScript').value;
  const cronValue = document.getElementById('jobCron').value.trim();
  const secretValue = document.getElementById('jobSecret').value.trim();

  if (executionType === 'command' && !commandValue) { showSnack('✗ Enter a command', 'err'); return; }
  if (executionType === 'script' && !scriptValue) { showSnack('✗ Select a script', 'err'); return; }
  if (triggerType === 'cron' && !cronValue) { showSnack('✗ Enter a cron expression', 'err'); return; }
  if (triggerType === 'webhook' && !secretValue) { showSnack('✗ Enter a webhook secret', 'err'); return; }
  if (!runAllCheckbox.checked && Array.from(platformsSelect.selectedOptions).length === 0) {
    showSnack('✗ Select at least one platform or enable "Run on all platforms"', 'err');
    return;
  }

  const payload = {
    name,
    description: document.getElementById('jobDescription').value.trim() || null,
    execution_type: executionType,
    command: executionType === 'command' ? commandValue : null,
    script_id: executionType === 'script' ? scriptValue || null : null,
    trigger_type: triggerType,
    cron_expression: triggerType === 'cron' ? cronValue : null,
    repository_url: triggerType === 'github_push' ? document.getElementById('jobRepo').value.trim() : null,
    repository_branch: triggerType === 'github_push' ? document.getElementById('jobBranch').value.trim() : null,
    webhook_secret: triggerType === 'webhook' ? secretValue : null,
    run_on_all_platforms: runAllCheckbox.checked,
    target_platform_ids: runAllCheckbox.checked ? [] : Array.from(platformsSelect.selectedOptions).map(o => o.value),
    environment: parseEnv(document.getElementById('jobEnv').value),
    tags: parseList(document.getElementById('jobTags').value),
    timeout_seconds: Number(document.getElementById('jobTimeout').value || 900),
    max_retries: Number(document.getElementById('jobRetries').value || 0),
    is_enabled: true
  };

  try {
    const response = await fetch('/api/automations/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      showSnack(`✗ ${err.error || response.statusText}`, 'err');
      return;
    }
    closeJobModal();
    loadJobs();
    showSnack('✓ Automation created', 'ok');
  } catch (error) {
    showSnack(`✗ ${error.message}`, 'err');
  }
});

loadPlatforms();
loadScriptsForModal();
loadJobs();
updateExecutionFields();
updateTriggerFields();
</script>
{% endblock %}
