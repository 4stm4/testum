{% extends "layout.html" %}
{% block title %}Audit log_ — testum{% endblock %}

{% block content %}
<div class="pg-head">
  <div>
    <div class="pg-title"><span data-i18n="auditLogs">Audit log</span><span class="cur"></span></div>
    <div class="pg-sub" id="audit-sub">—</div>
  </div>
  <div class="toolbar">
    <button class="btn btn-ghost" onclick="exportAudit()">↓ <span data-i18n="export">Export</span></button>
  </div>
</div>

<!-- Filter row -->
<div style="display:flex;gap:var(--sp-3);margin-bottom:var(--sp-5);flex-wrap:wrap;align-items:center;">
  <div class="cmd-input" style="flex:1;min-width:200px;">
    <span class="pmt">⌕</span>
    <input type="text" id="audit-search" data-i18n="auditSearchPlaceholder" placeholder="search user, action…" oninput="applyFilters()">
  </div>
  <select class="input" id="audit-action" style="width:160px;" onchange="applyFilters()">
    <option value="" data-i18n="allActions">All actions</option>
    <option value="create">create</option>
    <option value="delete">delete</option>
    <option value="login">login</option>
    <option value="run">run</option>
    <option value="deploy">deploy</option>
  </select>
  <select class="input" id="audit-range" style="width:140px;" onchange="applyFilters()">
    <option value="24h" data-i18n="last24h">Last 24h</option>
    <option value="7d" data-i18n="last7d">Last 7 days</option>
    <option value="30d" data-i18n="last30d">Last 30 days</option>
    <option value="all" selected data-i18n="allTime">All time</option>
  </select>
</div>

<div class="card" style="padding:0;overflow:hidden;">
  <table class="tbl" id="audit-table">
    <thead>
      <tr>
        <th data-i18n="timestamp">Timestamp</th>
        <th data-i18n="user">User</th>
        <th data-i18n="action">Action</th>
        <th data-i18n="object">Object</th>
        <th data-i18n="details">Details</th>
      </tr>
    </thead>
    <tbody id="audit-body">
      <tr><td colspan="5" class="empty-state">$ loading…</td></tr>
    </tbody>
  </table>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--sp-4);">
  <span id="audit-count" style="font-size:var(--t-xs);color:var(--fg-dim);">—</span>
  <div style="display:flex;gap:var(--sp-2);">
    <button class="btn btn-ghost" id="prev-btn" onclick="prevPage()" disabled data-i18n="prevPage">← prev</button>
    <button class="btn btn-ghost" id="next-btn" onclick="nextPage()" data-i18n="nextPage">next →</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let auditAll = [], auditFiltered = [], page = 0;
const PAGE = 50;

async function loadAudit() {
  try {
    const r = await fetch('/api/audit/?limit=500');
    const d = await r.json();
    auditAll = Array.isArray(d) ? d : (d.items || []);
    applyFilters();
  } catch(e) { document.getElementById('audit-body').innerHTML = '<tr><td colspan="5" class="empty-state">✗ failed to load</td></tr>'; }
}

function applyFilters() {
  const q = document.getElementById('audit-search').value.toLowerCase();
  const action = document.getElementById('audit-action').value;
  const range = document.getElementById('audit-range').value;
  const now = Date.now();
  const cutoff = range==='24h'?now-86400000:range==='7d'?now-7*86400000:range==='30d'?now-30*86400000:0;
  auditFiltered = auditAll.filter(e => {
    if (q && !JSON.stringify(e).toLowerCase().includes(q)) return false;
    if (action && !(e.action||'').toLowerCase().includes(action)) return false;
    if (cutoff && e.timestamp && new Date(e.timestamp).getTime() < cutoff) return false;
    return true;
  });
  page = 0;
  renderPage();
}

function renderPage() {
  const slice = auditFiltered.slice(page*PAGE, (page+1)*PAGE);
  const tbody = document.getElementById('audit-body');
  document.getElementById('audit-sub').textContent = auditFiltered.length + ' entries';
  document.getElementById('audit-count').textContent = `${page*PAGE+1}–${Math.min((page+1)*PAGE, auditFiltered.length)} of ${auditFiltered.length}`;
  document.getElementById('prev-btn').disabled = page===0;
  document.getElementById('next-btn').disabled = (page+1)*PAGE >= auditFiltered.length;
  if (!slice.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">$ no entries found_</td></tr>';
    return;
  }
  tbody.innerHTML = slice.map(e => {
    const cls = e.action&&e.action.includes('delete')?'err':e.action&&e.action.includes('create')?'ok':'muted';
    const ts = e.timestamp ? new Date(e.timestamp).toLocaleString() : '—';
    const meta = e.meta ? JSON.stringify(e.meta).substring(0,60)+'…' : '—';
    return `<tr>
      <td class="tbl-mono">${ts}</td>
      <td style="font-weight:600;">${e.user||'—'}</td>
      <td><span class="pill pill-${cls}">${e.action ? (t('action_'+e.action)||e.action) : '—'}</span></td>
      <td class="tbl-mono">${e.object_type||'—'} ${e.object_id?'#'+e.object_id.substring(0,8):''}</td>
      <td class="tbl-mono" style="font-size:11px;color:var(--fg-dim);">${meta}</td>
    </tr>`;
  }).join('');
}

function prevPage() { if(page>0){page--;renderPage();} }
function nextPage() { if((page+1)*PAGE<auditFiltered.length){page++;renderPage();} }

function exportAudit() {
  const csv = ['Timestamp,User,Action,Object,ObjectID'].concat(
    auditFiltered.map(e => `"${e.timestamp||''}","${e.user||''}","${e.action||''}","${e.object_type||''}","${e.object_id||''}"`)
  ).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'audit-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  showSnack('✓ CSV downloaded', 'ok');
}

loadAudit();
</script>
{% endblock %}
