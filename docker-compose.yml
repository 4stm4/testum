# Testum Docker Compose — Production-ready configuration
# Secrets are loaded from .env.prod (never commit that file).
# Copy .env.prod.example → .env.prod and fill in values before starting.

x-app-env: &app-env
  env_file: .env.prod
  environment:
    PYTHONPATH: /app/src
    PYJOBKIT_ENGINE: app.task_engine:engine

services:
  nginx:
    image: nginx:alpine
    container_name: testum_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/conf.d/rate_limit.conf:/etc/nginx/conf.d/rate_limit.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_html:/usr/share/nginx/html:ro
    networks:
      - testum_network
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: testum_db
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --lc-collate=C --lc-ctype=C.UTF-8"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - testum_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache musl-locales musl-locales-lang
        exec docker-entrypoint.sh postgres

  minio:
    image: minio/minio:latest
    container_name: testum_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env.prod
    volumes:
      - minio_data:/data
    networks:
      - testum_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: testum/app:latest
    container_name: testum_app
    restart: unless-stopped
    working_dir: /app
    <<: *app-env
    networks:
      - testum_network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: ["/app/entrypoint.sh"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: testum/worker:latest
    container_name: testum_worker
    restart: unless-stopped
    working_dir: /app
    <<: *app-env
    networks:
      - testum_network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-m", "app.worker_launcher"]

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: testum/backup:latest
    container_name: testum_backup
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - testum_network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

networks:
  testum_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  nginx_html:
