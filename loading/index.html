<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>testum_ · starting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#0A090D; --s1:#14131A; --s2:#1B1A22; --s3:#25232D; --s4:#2E2C38; --s5:#3A3845;
      --fg:#F0EEF5; --fg-m:#9B98A8; --fg-d:#5C5A68;
      --signal:#B9FF66; --line:#2E2C38;
      --font:'JetBrains Mono',monospace;
    }
    body{
      font-family:var(--font);background:var(--bg);color:var(--fg);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:20px;
      background-image:radial-gradient(ellipse 70% 50% at 50% 20%,
        color-mix(in srgb,var(--signal) 6%,transparent),transparent 70%);
    }
    .wrap{width:100%;max-width:480px;}
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
    .glyph{
      width:48px;height:48px;background:var(--s2);border:1px solid var(--line);
      border-radius:10px;display:flex;align-items:center;justify-content:center;
      color:var(--signal);font-size:20px;font-weight:700;
    }
    .wordmark{font-size:26px;font-weight:700;letter-spacing:-0.06em;}
    .cur{display:inline-block;width:0.5em;height:0.9em;background:var(--signal);vertical-align:text-bottom;margin-left:1px;animation:blink 1.1s step-end infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .by{font-size:10px;color:var(--fg-d);margin-top:2px;}
    .by b{color:var(--fg-m);}
    .card{background:var(--s1);border:1px solid var(--s4);border-radius:16px;padding:28px;}
    .status-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--fg-d);margin-bottom:6px;}
    .status-line{font-size:14px;color:var(--fg);margin-bottom:20px;min-height:21px;}
    .status-line .p{color:var(--signal);}
    .prog-track{height:2px;background:var(--s4);border-radius:1px;overflow:hidden;margin-bottom:24px;}
    .prog-fill{height:100%;background:var(--signal);border-radius:1px;width:30%;animation:prog 2.5s ease-in-out infinite;}
    @keyframes prog{0%{width:20%}50%{width:75%}100%{width:20%}}
    .steps{display:flex;flex-direction:column;gap:8px;}
    .step{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-d);}
    .step.done{color:var(--fg-m);}
    .step.active{color:var(--fg);}
    .step-ico{width:14px;height:14px;border-radius:50%;flex-shrink:0;background:var(--s4);}
    .step.done .step-ico{background:var(--signal);}
    .step.active .step-ico{background:transparent;border:2px solid var(--signal);box-shadow:0 0 6px var(--signal);}
    .footer{margin-top:20px;display:flex;justify-content:space-between;font-size:10px;color:var(--fg-d);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="glyph">&gt;_</div>
      <div>
        <div class="wordmark">testum<span class="cur"></span></div>
        <div class="by">a <b>4stm4</b> tool</div>
      </div>
    </div>
    <div class="card">
      <div class="status-label">Boot sequence</div>
      <div class="status-line"><span class="p">$</span> <span id="statusText">starting up…</span></div>
      <div class="prog-track"><div class="prog-fill"></div></div>
      <div class="steps">
        <div class="step done"><div class="step-ico"></div><span>postgres ready</span></div>
        <div class="step done"><div class="step-ico"></div><span>minio ready</span></div>
        <div class="step active" id="step-app"><div class="step-ico"></div><span>waiting for app…</span></div>
      </div>
      <div class="footer">
        <span>v0.2.0 · main</span>
        <span>4stm4/testum · MIT</span>
      </div>
    </div>
  </div>
  <script>
    let n=0;
    const msgs=['starting up…','loading modules…','checking db…','waiting for app…'];
    function poll(){
      n++;
      document.getElementById('statusText').textContent=msgs[n%msgs.length];
      const proto=window.location.protocol, host=window.location.hostname;
      fetch(proto+'//'+host+':8001/health',{cache:'no-store'})
        .then(r=>{
          if(r.ok){
            document.getElementById('statusText').textContent='ready — redirecting…';
            document.getElementById('step-app').className='step done';
            setTimeout(()=>{window.location.href=proto+'//'+host+':8001/login';},800);
          } else setTimeout(poll,2000);
        }).catch(()=>setTimeout(poll,2000));
    }
    setTimeout(poll,1200);
  </script>
</body>
</html>
