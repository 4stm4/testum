[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = src
omit =
    src/app/worker_launcher.py
    src/app/updater.py
    src/adapters/libvirt/*
    src/adapters/storage/*
    src/adapters/websocket/*
    src/adapters/queue/*
    src/adapters/scheduler/*
    src/adapters/notifications/*
    src/ports/ws/*
    src/ports/cli/*
    migrations/*

[coverage:report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    pass

[coverage:html]
directory = htmlcov
title = Testum Coverage Report

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .venv,
    __pycache__,
    migrations/
